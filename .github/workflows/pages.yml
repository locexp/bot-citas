name: Publicar en GitHub Pages

on:
  push:
    branches: [main, ccr-962fb0fd-stdhyu]
    paths: ["pagina/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar el sitio (presentación + app)
        run: |
          mkdir -p _site/app
          cp pagina/index.html _site/
          cp web/index.html web/icono.svg web/manifest.webmanifest _site/app/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
